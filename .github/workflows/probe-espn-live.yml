# Temporary: checks ESPN prop lines for players listed with more than one value. Deleted after use.
name: Probe ESPN provider live
on:
  push:
    branches: [claude/probe-espn-live]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Multiple values per player and market
        run: |
          curl -sS "https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard" -o sb.json
          for E in $(jq -r '.events[] | select(.status.type.completed == false) | .id' sb.json | head -8); do
            for P in 1 2; do curl -sS "https://sports.core.api.espn.com/v2/sports/football/leagues/nfl/events/$E/competitions/$E/odds/100/propBets?lang=en&region=us&limit=1000&page=$P" -o "p_${E}_$P.json"; done
            jq -s -c --arg e "$E" '[.[].items[]? | select(.type.name | test("^Total (Passing|Rushing|Receiving) Yards|^Total Receptions|^Total Passing Touchdowns")) | {a: (.athlete["$ref"] | capture("athletes/(?<id>[0-9]+)").id), t: .type.name, v: .current.target.value, o: .open.target.value}] | group_by([.a, .t]) | map({a: .[0].a, t: .[0].t, n: length, vals: (map(.v) | group_by(.) | map({v: .[0], n: length})), open: (map(.o) | unique)}) | {event: $e, groups: length, multi: map(select(.vals | length > 1))}' p_${E}_1.json p_${E}_2.json | head -c 2500; echo
          done
      - name: Two athletes by name
        run: |
          for A in 3925357 3116365; do curl -sS "https://sports.core.api.espn.com/v2/sports/football/leagues/nfl/seasons/2026/athletes/$A" | jq -c '{id, displayName}'; done
