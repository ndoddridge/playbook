# Temporary: confirms the new Playbook build is live. Deleted after use.
name: Probe ESPN provider live
on:
  push:
    branches: [claude/probe-espn-live]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for the new build
        run: |
          for i in $(seq 1 40); do
            b=$(curl -sS "https://noahdbuilds.com/playbook/BUILD.txt?try=$i" | head -c 7)
            echo "try $i: $b"
            [ "$b" = "567ab14" ] && break
            sleep 20
          done
          curl -sS -o /dev/null -w '%{http_code} app page\n' https://noahdbuilds.com/playbook/quick-picks
