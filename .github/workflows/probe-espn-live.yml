# Temporary: diagnoses ESPN refusing the noahdbuilds.com relay. Deleted after use.
name: Probe ESPN provider live
on:
  push:
    branches: [claude/probe-espn-live]
jobs:
  probe:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash {0}
    steps:
      - name: Through the live relay
        run: |
          R=https://noahdbuilds.com/playbook/api/relay
          for U in \
            "site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard" \
            "site.api.espn.com/apis/site/v2/sports/football/nfl/news?limit=40" \
            "site.web.api.espn.com/apis/site/v2/sports/football/nfl/injuries" \
            "sports.core.api.espn.com/v2/sports/football/leagues/nfl/events/401872981/competitions/401872981/odds/100/propBets?lang=en&region=us&limit=10" \
            "api.sleeper.app/v1/state/nfl" ; do
            echo "== $U"; curl -sS -o body.txt -w '%{http_code} %{content_type}\n' "$R/$U"; head -c 300 body.txt; echo
          done
      - name: ESPN directly, as a browser on noahdbuilds.com would
        run: |
          for U in \
            "https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard" \
            "https://site.api.espn.com/apis/site/v2/sports/football/nfl/news?limit=40" \
            "https://site.web.api.espn.com/apis/site/v2/sports/football/nfl/injuries" \
            "https://site.web.api.espn.com/apis/site/v2/sports/football/nfl/teams/28/roster" \
            "https://sports.core.api.espn.com/v2/sports/football/leagues/nfl/events/401872981/competitions/401872981/odds/100/propBets?lang=en&region=us&limit=10" ; do
            echo "== $U"
            curl -sS -o /dev/null -D - -H "Origin: https://noahdbuilds.com" -A "Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Mobile/15E148" "$U" | grep -iE '^HTTP|access-control|^server|^x-cache|cf-' 
            echo "-- preflight"
            curl -sS -o /dev/null -D - -X OPTIONS -H "Origin: https://noahdbuilds.com" -H "Access-Control-Request-Method: GET" -H "Access-Control-Request-Headers: accept" "$U" | grep -iE '^HTTP|access-control'
          done
      - name: ESPN directly with the relay's user agent
        run: |
          curl -sS -o /dev/null -w '%{http_code} relay UA\n' -A "Playbook (+https://noahdbuilds.com/playbook/)" "https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard"
          curl -sS -o /dev/null -w '%{http_code} no UA\n' -A "" "https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard"
