# Temporary: confirms the deployed relay reaches ESPN. Deleted after use.
name: Probe ESPN provider live
on:
  push:
    branches: [claude/probe-espn-live]
jobs:
  probe:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash {0}
    steps:
      - name: Wait for the deployed relay to reach ESPN
        run: |
          R=https://noahdbuilds.com/playbook/api/relay
          UA="Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.0 Mobile/15E148 Safari/604.1"
          for i in $(seq 1 40); do
            code=$(curl -sS -o sb.json -w '%{http_code}' -A "$UA" -H "Accept: application/json" "$R/site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?try=$i")
            echo "try $i: scoreboard $code"
            [ "$code" = "200" ] && break
            sleep 20
          done
          jq -c '{week: .week.number, games: (.events | length), withOdds: ([.events[] | select(.competitions[0].odds != null)] | length)}' sb.json
          for U in "site.api.espn.com/apis/site/v2/sports/football/nfl/news?limit=40" "site.web.api.espn.com/apis/site/v2/sports/football/nfl/injuries" "sports.core.api.espn.com/v2/sports/football/leagues/nfl/events/401872981/competitions/401872981/odds/100/propBets?lang=en&region=us&limit=1000&page=1" "api.sleeper.app/v1/state/nfl"; do
            curl -sS -o b.json -w "%{http_code} $U\n" -A "$UA" -H "Accept: application/json" "$R/$U"
          done
          curl -sS -o /dev/null -w '%{http_code} app page\n' -A "$UA" https://noahdbuilds.com/playbook/quick-picks
