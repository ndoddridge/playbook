# Temporary: captures sample responses from keyless odds sources. Deleted after use.
name: Probe odds sources
on:
  push:
    branches: [claude/probe-odds]
jobs:
  probe:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash {0}
    steps:
      - name: Pick a scheduled game
        run: |
          curl -sS "https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard" -o sb.json
          jq -r '[.events[] | select(.status.type.name == "STATUS_SCHEDULED")][0].id' sb.json > eid.txt
          cat eid.txt
          jq -c '[.events[] | {id, st: .status.type.name, oddsCount: (.competitions[0].odds | length), provider: .competitions[0].odds[0].provider.name}]' sb.json
          jq -c '.events[1].competitions[0].odds[0] | keys' sb.json
          curl -sS "https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?seasontype=2&week=6&dates=2026" | jq -c '.week, (.events | length), [.events[] | {id, date, st: .status.type.name, odds: (.competitions[0].odds | length)}][0:3]'
      - name: Prop bets in detail
        run: |
          E=$(cat eid.txt)
          curl -sS "https://sports.core.api.espn.com/v2/sports/football/leagues/nfl/events/$E/competitions/$E/odds/100/propBets?lang=en&region=us&limit=1000" -o p.json
          echo "count $(jq '.count' p.json) pageCount $(jq '.pageCount' p.json)"
          echo "== all keys"; jq -c '[.items[] | keys[]] | group_by(.) | map({k: .[0], n: length})' p.json
          echo "== current keys"; jq -c '[.items[] | .current | keys[]?] | group_by(.) | map({k: .[0], n: length})' p.json
          echo "== odds keys"; jq -c '[.items[] | .odds? | keys[]?] | group_by(.) | map({k: .[0], n: length})' p.json
          echo "== all type names"; jq -c '[.items[] | .type.name] | unique' p.json
          for T in "Total Passing Yards (incl. overtime)" "Total Rushing Yards (incl. overtime)" "Total Receiving Yards (incl. overtime)" "Total Receptions (incl. overtime)" "Total Passing Touchdowns (incl. overtime)" "Anytime Touchdown Scorer" "Team Total Points"; do
            echo "== $T"; jq -c --arg t "$T" '[.items[] | select(.type.name == $t)][0:3] | map(del(.competition, .provider))' p.json | head -c 2500; echo
          done
          echo "== athlete ref sample"; A=$(jq -r '[.items[] | select(.type.name == "Anytime Touchdown Scorer")][0].athlete["$ref"]' p.json); echo $A
          curl -sS "${A/http:/https:}" | jq -c '{id, displayName, fullName, position: .position.abbreviation, team: .team["$ref"]}'
      - name: Sleeper espn ids
        run: |
          curl -sS "https://api.sleeper.app/v1/players/nfl?position=WR&active=true" | jq -c '[.[] | select(.espn_id != null)] | length, ([.[]] | length), ([.[] | {full_name, espn_id, team}][0:3])'
